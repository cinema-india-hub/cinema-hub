<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="brand-mark">TH</span>
      <span><strong>{{ site.title }}</strong><small>FILM · OTT · INDIA</small></span>
    </a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}#latest">Latest</a>
      <a href="{{ '/' | relative_url }}#how-it-works">How it works</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div><strong>{{ site.title }}</strong><span>Signals in. Useful cinema coverage out.</span></div>
    <span>Built with GitHub Pages · Human approved</span>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
