name: weekly-release-roundup
on:
  schedule:
    - cron: "30 3 * * 3"       # Wednesday 03:30 UTC = 09:00 IST
  workflow_dispatch:
concurrency:
  group: cinema
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/draft.py calendar
      - run: python src/approve.py notify
      - name: Commit changes
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "weekly $(date -u +%F)" && git pull --rebase && git push)
