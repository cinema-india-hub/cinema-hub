name: cinema-hub
on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:
concurrency:
  group: cinema
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/approve.py poll      # publish anything you approved
      - run: python src/trends.py            # find new film/OTT trends
      - run: python src/draft.py trends      # draft them
      - run: python src/approve.py notify    # send drafts to your Telegram
      - name: Commit changes
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto $(date -u +%F-%H%M)" && git pull --rebase && git push)
